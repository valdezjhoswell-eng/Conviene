name: Compilar ¿Conviene? 0.8.1-STABLE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir fuente ¿Conviene?
        run: |
          rm -rf proyecto
          mkdir -p proyecto
          unzip -o Conviene_0.8.1_STABLE_source.zip -d proyecto

      - name: Compilar APK Debug
        working-directory: proyecto/RentableZone
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Conviene-0.8.1-STABLE
          path: proyecto/RentableZone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Guardar log si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Conviene-0.8.1-BUILD-LOG
          path: proyecto/RentableZone/build.log
          if-no-files-found: warn
