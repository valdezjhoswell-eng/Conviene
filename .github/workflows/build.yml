name: Compilar ¿Conviene? 0.8.0-STABLE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir fuente ¿Conviene?
        run: |
          rm -rf proyecto
          mkdir -p proyecto
          unzip -o Conviene_0.8.0_STABLE_CORREGIDO_source.zip -d proyecto
      - name: Compilar APK Debug
        working-directory: proyecto/RentableZone
        run: |
          gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Conviene-0.8.0-STABLE
          path: proyecto/RentableZone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
